name: load-metrics

on:
  workflow_dispatch:
    inputs:
      start_partition:
        description: "First date (YYYY-MM-DD) to ETL. Blank means latest. If end_partition differs, every date in between is backfilled in parallel."
        required: false
      end_partition:
        description: "Last date (YYYY-MM-DD, inclusive) to ETL. Defaults to start_partition (a single day) if blank."
        required: false
      job:
        description: "Which job(s) to run. 'all' (default) runs every partitioned and non-partitioned job."
        required: false
        type: choice
        default: all
        options:
          - all
          - partitioned
          - nonpartitioned
          - s3
          - kaggle
          - github_partitioned
          - github_nonpartitioned
          - zenodo
          - eel_hole
      rebuild:
        description: "Only with job 's3'. Rebuild the compacted S3 log artifact for EVERY day in the range, replacing any that exists (each is a full re-list, compose and upload). Default: reuse existing artifacts."
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "14 7 * * *" # Every day at 7:14 AM UTC

env:
  METRICS_PROD_ENV: "prod"
  # Threads for downloading blobs from GCS (default 32). After S3 log compaction a
  # 137k-object day downloads 134 objects, which take about 10 s with combining,
  # compressing and uploading.
  GCS_DOWNLOAD_WORKERS: "32"
  # default is 128
  GCS_COMPOSE_WORKERS: "128"

jobs:
  compute-partitions:
    runs-on: ubuntu-latest
    outputs:
      partitions: ${{ steps.compute.outputs.partitions }}
      # Whether the matrix has more than one *dated* partition in it (i.e. a
      # real backfill, not a single day). Threaded through to load-metrics so
      # it knows to skip all_nonpartitioned_metrics_etl on each dated entry
      # (see the comment on that step for why).
      multiple: ${{ steps.compute.outputs.multiple }}
    steps:
      # Fail once, up front, instead of once per matrix job: the CLI only
      # accepts --rebuild together with --job s3.
      - name: Reject rebuild for anything but the s3 job
        if: ${{ github.event.inputs.rebuild == 'true' && github.event.inputs.job != 's3' }}
        env:
          JOB: ${{ github.event.inputs.job }}
        run: |
          echo "::error::The 'rebuild' input only applies to the 's3' job, but job is '${JOB:-all}'."
          exit 1

      - uses: actions/checkout@v7

      - name: Install usage metrics environment using pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true
          cache: true

      - name: Compute the list of partitions to ETL
        id: compute
        shell: bash -l {0}
        # A multi-day "all" backfill skips non-partitioned jobs on each dated matrix
        # entry below to avoid them racing to overwrite the same un-dated output file.
        # Add one extra matrix entry -- using the literal string "nonpartitioned" as a
        # sentinel, since real partitions are always YYYY-MM-DD and can't collide with
        # it -- to run them exactly once, so "all" actually refreshes everything.
        run: |
          partitions=$(pixi run usage-metrics partitions \
            --start "${{ github.event.inputs.start_partition }}" \
            --end "${{ github.event.inputs.end_partition }}")
          count=$(echo "$partitions" | jq 'length')
          multiple=$([ "$count" -gt 1 ] && echo true || echo false)
          job="${{ github.event.inputs.job }}"
          if [[ "$multiple" == "true" && ( -z "$job" || "$job" == "all" ) ]]; then
            partitions=$(echo "$partitions" | jq -c '. + ["nonpartitioned"]')
          fi
          echo "partitions=$partitions" >> "$GITHUB_OUTPUT"
          echo "multiple=$multiple" >> "$GITHUB_OUTPUT"

      - name: Notify Zulip of workflow launch
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: "build-status-bot@catalyst-cooperative.zulipchat.com"
          organization-url: "https://catalyst-cooperative.zulipchat.com"
          type: "stream"
          to: "pudl-deployments"
          topic: "pudl-usage-metrics"
          content: |
            # :rocket: Launching `load-metrics` workflow ([view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})): job `${{ github.event.inputs.job || 'all' }}`, partitions `${{ steps.compute.outputs.partitions }}`${{ github.event.inputs.rebuild == 'true' && ' -- **rebuilding the compacted S3 log artifacts**' || '' }}

  load-metrics:
    needs: compute-partitions
    runs-on: ubuntu-latest
    # A healthy run finishes in minutes. Measured for the S3 job, a fresh partition of
    # ~137k log objects took 5-7 minutes end to end and re-running an already-compacted
    # one took ~2, so the 30-minute limit is about 4x the slowest of those. This applies
    # per matrix job (i.e. per partition), not to the matrix as a whole, and keeps a
    # regression from burning the full 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      # One partition failing shouldn't cancel the rest of a backfill.
      fail-fast: false
      matrix:
        partition: ${{ fromJson(needs.compute-partitions.outputs.partitions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install usage metrics environment using pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          locked: true
          cache: true

      # Authentication via credentials json
      - id: "auth"
        uses: "google-github-actions/auth@v3"
        with:
          workload_identity_provider: "projects/345950277072/locations/global/workloadIdentityPools/gh-actions-pool/providers/gh-actions-provider"
          service_account: "pudl-usage-metrics-etl@catalyst-cooperative-pudl.iam.gserviceaccount.com"
          create_credentials_file: true

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"
        with:
          version: ">= 363.0.0"

      - name: Run ETL on the latest day's data
        id: load-data
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          PARTITION: ${{ matrix.partition }}
          JOB: ${{ github.event.inputs.job }}
          # Non-partitioned outputs (e.g. GitHub repo stats) aren't scoped to a
          # date; running them once per dated backfill entry would just have
          # concurrent jobs racing to overwrite the same file. Only applies to
          # the default "all" selection with more than one dated partition --
          # compute-partitions adds a dedicated "nonpartitioned" matrix entry
          # (handled below) to run them exactly once in that case. An explicit
          # --job or --partitioned/--no-partitioned choice is mutually
          # exclusive with this flag, and the CLI itself rejects a
          # non-partitioned job paired with a real date range.
          SKIP_NONPARTITIONED: ${{ needs.compute-partitions.outputs.multiple }}
          # "true" only for a manual dispatch that ticked "rebuild" (empty on
          # scheduled runs). compute-partitions has already rejected it for
          # any job other than s3, which is all the CLI's --rebuild accepts.
          REBUILD: ${{ github.event.inputs.rebuild }}
        shell: bash -l {0}
        run: |
          args=()
          if [[ "$PARTITION" == "nonpartitioned" ]]; then
            # The dedicated single-run matrix entry added for a multi-day
            # "all" backfill -- see compute-partitions above.
            args+=(--no-partitioned)
          else
            [[ -n "$PARTITION" ]] && args+=(--partition "$PARTITION")
            case "$JOB" in
              ""|all)
                [[ "$SKIP_NONPARTITIONED" == "true" ]] && args+=(--partitioned)
                ;;
              partitioned)
                args+=(--partitioned)
                ;;
              nonpartitioned)
                args+=(--no-partitioned)
                ;;
              *)
                args+=(--job "$JOB")
                ;;
            esac
          fi
          [[ "$REBUILD" == "true" ]] && args+=(--rebuild)
          pixi run usage-metrics etl "${args[@]}"

      - name: Notify Zulip
        if: always()
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: "build-status-bot@catalyst-cooperative.zulipchat.com"
          organization-url: "https://catalyst-cooperative.zulipchat.com"
          type: "stream"
          to: "pudl-deployments"
          topic: "pudl-usage-metrics"
          content: |
            ${{ job.status == 'success' && ':check:' || job.status == 'failure' && ':x:' || ':warning:' }} `load-metrics` (partition `${{ matrix.partition }}`) completed with status `${{ job.status }}`.
            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
